    1 Mb; the length of the annealing schedule is up to you) or an equivalent restraint-based method. Then compare
    it with the published structure on chromosome 1: average the published first model''s particles into the same
    1-Mb bins (bin k holds the particles whose sequence position, the last column of the PDB, is in [k Mb, (k+1)
    Mb)), and report the Spearman correlation between the pairwise distances of your structure and of the published
    one over chr1''s bin pairs (each unordered pair of distinct bins present in both, once).'
  truth: nucdyn_cell2
  grade:
    numbers_min:
    - rho
  method_ref: NucDynamics (Stevens et al. 2017; github.com/tjs23/nuc_dynamics @ 00eaf0b)
  check: floor
  family: schic
- id: R3
  category: schic
  split: v3
  kind: method
  data: schicar
  prompt: 'Impute the chromosome 1 contact maps of two scHiCAR mouse cortex cells, GTGAAATCTACGAGATAC and TAGACCGGTATGTACCCG
    (their 1-Mb maps in contacts_cells_1Mb.scool, cell name = cell id), with the convolution and random walk with
    restart of scHiCluster (Zhou et al. 2019, PNAS 116:14011) exactly as the authors'' code does it (function impute_cpu
    in schicluster/schicluster.py of the PyPI package schicluster 1.3.2, pad 1, restart probability 0.5): with U
    the cell''s stored chr1 pixels as an upper-triangular 196 x 196 count matrix (bins of 1 Mb, diagonal included),
    A = log2(U + U^T + 1); smooth A with a 3 x 3 mean filter (zeros outside the matrix, divided by 9); set the diagonal
    to 0, then put 1 on the diagonal of every bin whose column sums to 0; divide every column by its sum (P); iterate
    Q <- 0.5 I + 0.5 Q P from Q = I until the Frobenius norm of the change is below 1e-6 (at most 30 iterations);
    symmetrise the result, (Q + Q^T) / 2. Report the Pearson correlation between the two cells'' imputed maps over
    the pixels (i, j) with i < j.'
  truth: rwr_pair_corr
  grade:
    numbers:
    - r
    tol: 0.005
  method_ref: random walk with restart imputation of scHiCluster (Zhou et al. 2019, PNAS); schicluster 1.3.2 (PyPI),
    impute_cpu
  check: parity
  note: 'cells: the median-chr1-contact Oligo and L6CT cells (truth/schic_explore.py)'
  family: schic
- id: R4
  category: schic
  split: v3
  kind: method
  data: schicar+schicar_types
  prompt: 'Embed all 5,313 scHiCAR mouse cortex cells with scHiCluster (Zhou et al. 2019, PNAS 116:14011) from their
    1-Mb single-cell maps (contacts_cells_1Mb.scool, cell name = cell id; cell types in schicar_cell_types.tsv),
    using the autosomes chr1-chr19: impute every cell''s intra-chromosomal map with scHiCluster''s convolution (pad
    1, a 3 x 3 mean filter) and random walk with restart (restart probability 0.5); binarise each cell''s imputed
    chromosome map, keeping its values above the cell''s own 80th percentile (the top 20 %) as 1 and the rest as
    0; reduce the binary vectors of all cells to 20 principal components per chromosome, concatenate the 19 chromosomes''
    components (380 per cell), and reduce them to 20 principal components with a second PCA. Report the k-nearest-neighbour
    purity of the cell types in these 20 components: for every cell, the fraction of its 30 nearest other cells
    (Euclidean distance) that carry the same label in the column cell_type of schicar_cell_types.tsv (22 labels,
    used as given), averaged over all cells.'
  truth: schicluster_knn
  grade:
    numbers_min:
    - purity
  method_ref: scHiCluster embedding (Zhou et al. 2019, PNAS); schicluster 1.3.2 (PyPI), impute_cpu + hicluster_cpu
    with 20 PCs per chromosome
  check: floor
  note: 'k = 30, not 10: at 10 the no-imputation baseline sits within the spread of correct variants (reports/schic.md)'
  family: schic
- id: R5
  category: schic
  split: v3
  kind: method
  data: schicar+mm10_cpg_1mb
  prompt: 'Compute the single-cell compartment score of scHiCluster (Zhou et al. 2019, PNAS 116:14011; "hicluster
    compartment", function single_chrom_compartment of the GitHub release v1.3.4 of zhoujt1994/scHiCluster, adopted
    from the scA/B value of Tan et al. 2018) for all 5,313 scHiCAR mouse cortex cells on the 1-Mb bins of chr1-chr19:
    for each cell and chromosome, take the cell''s raw intra-chromosomal map from contacts_cells_1Mb.scool (symmetric,
    each contact once), set its diagonal to 0, put 1 on the diagonal of every bin without any contact, divide every
    row by its sum, and multiply by the CpG ratio of the bins (mm10_cpg_1Mb.tsv, column cpg_ratio: CG dinucleotides
    per non-N base); each bin''s score is thus the contact-weighted mean CpG ratio of its partners (its own CpG
    ratio when it has no contact). Average the scores of each bin over all cells. Then compute the compartment eigenvector
    E1 of the pseudo-bulk of all cells at 1 Mb (contacts_all.mcool::/resolutions/1000000, its stored balancing weights)
    per chromosome as cooltools'' eigs_cis does (main diagonal and first off-diagonal ignored, observed over expected,
    clipped at the 99.9th percentile, leading eigenvector), each chromosome''s E1 oriented to correlate positively
    (Pearson) with the CpG ratio. The score is built from the CpG ratio, so report how much it tells about E1 beyond
    the CpG ratio itself: the partial correlation of the mean score and E1 given the CpG ratio, i.e. the Pearson
    correlation between the residuals of the mean score and of E1 after each is fitted by least squares (with an
    intercept) as a linear function of the CpG ratio, over the bins of chr1-chr19 that have a CpG ratio above 0
    and a defined E1.'
  truth: scab_vs_e1
  grade:
    numbers:
    - r_partial_cpg
    tol: 0.05
  method_ref: scHiCluster compartment score (Zhou et al. 2019; GitHub v1.3.4 single_chrom_compartment) + cooltools
    eigs_cis
  check: parity
  note: graded on the partial correlation given CpG, not the plain r (the CpG ratio alone gives 0.704 vs 0.714)
  family: schic
- id: R6
  category: schic
  split: v3
  kind: method
  data: nagano_hap_2i
  prompt: 'Nagano et al. 2017 (Nature 547:61) placed single haploid mouse ES cells in the cell cycle by the genomic
    distances of their contacts. For the 395 cells given (cells.tsv; adj/<cell>.adj: the authors'' fend-pair tables
    fend1, fend2, count; GATC.fends: fend, chromosome, coordinate on mm9), count every fend pair once (ignore the
    count column; (a, b) and (b, a) are the same pair), keep the pairs whose two fends lie on the same chromosome
    among chr1-chr19 and chrX (1-19 and X in GATC.fends), with distance d = |coordinate 1 - coordinate 2| (bp) greater
    than 2^14.5, and compute for each cell the fraction of these contacts in the "near" band (2^14.5 < d <= 2^21)
    and in the "mitotic" band (2^21 < d <= 2^23.5). Assign each cell a phase with the paper''s gates (schic2 code,
    "newer" criteria): post-M if mitotic >= 0.3 and near <= 0.42; otherwise pre-M if near > 0.42 and 1.8 x mitotic
    + near > 1; otherwise G1 if near <= 0.611, early-S if 0.611 < near <= 0.77, and mid-S/G2 if near > 0.77. Report
    the median near fraction, the median mitotic fraction over the 395 cells, and the number of cells in each of
    the five phases.'
  truth: nagano_cellcycle
  grade:
    numbers:
    - median_f_near
    - median_f_mitotic
    - n_post-M
    - n_G1
    - n_early-S
    - n_mid-S/G2
    - n_pre-M
    tol: 0.02
  method_ref: Nagano et al. 2017 cell-cycle phasing by contact distances (github.com/tanaylab/schic2, ordering.r)
  check: parity
  note: the definitions reproduce the published per-cell f_near_band / f_mitotic_band of all 395 cells (5e-10)
  family: schic
- id: BH1
  category: bulk
  split: v3
  kind: method
  data: rao_chr21_10kb
  prompt: 'This is the in situ Hi-C map of IMR90 cells of Rao et al. 2014 (Cell 159:1665), chromosome 21 at 10-kb
    resolution (hg19), as a .cool file with ICE balancing weights in the bin column "weight" (IMR90_chr21_10kb_hg19.cool).
    Call loops on chr21 with Mustache (Roayaei Ardakany et al. 2020, Genome Biology 21:256) on the balanced map
    with these parameters: sigma0 = 1.6, 2 octaves, 10 scales (iterations) per octave, q-value (FDR) threshold 0.1
    (option -pt), sparsity threshold 0.88 (option -st), largest distance between the two anchors of a loop 2 Mb
    (option -d). Count every loop of chr21 once (one row per loop). How many loops are there?'
  truth: mustache_loops_chr21
  grade:
    numbers:
    - n_loops
    tol: 0.04
  reference: midpoint 161 of U-Chrom 157 and mustache-hic 1.3.3 165; band 154.6-167.4 (reports/bulk.md)
  method_ref: Mustache (Roayaei Ardakany et al. 2020); mustache-hic 1.3.3 (PyPI; needs numpy < 2, scipy < 1.15)
  check: parity
  family: bulk
  id_in_family: H1
- id: BH2
  category: bulk
  split: v3
  kind: method
  data: rao_chr21_10kb
  prompt: 'This is the in situ Hi-C map of IMR90 cells of Rao et al. 2014 (Cell 159:1665), chromosome 21 at 10-kb
    resolution (hg19; a .cool file with ICE balancing weights in the bin column "weight"), and the authors'' published
    HiCCUPS loop list of IMR90 (GSE63525_IMR90_HiCCUPS_looplist.txt.gz; chr21 = the 92 rows whose chr1 is 21, anchors
    x1-x2 and y1-y2, hg19). Call loops on chr21 of this 10-kb map yourself with HiCCUPS (Rao et al. 2014): expected
    = the mean balanced contact of each diagonal of chr21 (the first two diagonals ignored); donut, lower-left,
    vertical and horizontal kernels with peak half-width p = 2 and window half-width w = 5 bins; locally adjusted
    expecteds converted to raw counts; Poisson tests with lambda-chunks and a Benjamini-Hochberg FDR of 0.1 within
    each chunk, for every kernel; a pixel is enriched when it passes all four kernels; pixels up to 10 Mb from the
    diagonal; enriched pixels clustered with a 20-kb radius, the brightest pixel of a cluster being the loop; then
    the HiCCUPS filter of Rao et al. 2014 (observed above 1.5 x the vertical and the horizontal expecteds, above
    1.75 x the donut and the lower-left expecteds and above 2 x one of these two; a single-pixel cluster also needs
    the sum of its four q-values to be at most 0.02). A published loop is recovered when one of your loops has both
    anchor midpoints within 25 kb of the published anchors'' midpoints (the larger of the two offsets at most 25
    kb). Report the number of loops you call, the recall (recovered published loops / 92) and the precision (the
    share of your loops that lie, by the same rule, within 25 kb of a published loop).'
  truth: hiccups_vs_published_chr21
  grade:
    numbers_min:
    - recall
    - precision
  method_ref: HiCCUPS (Rao et al. 2014); cooltools 0.7.1 dots (Open2C 2024; needs pandas < 3)
  check: floor
  family: bulk
  id_in_family: H2
- id: BH3
  category: bulk
  split: v3
  kind: method
  data: rao_chr21_10kb
  prompt: 'This is the in situ Hi-C map of IMR90 cells of Rao et al. 2014 (Cell 159:1665), chromosome 21 at 10-kb
    resolution (hg19; a .cool file with ICE balancing weights in the bin column "weight"), and the authors'' HiCCUPS
    loops of IMR90 (GSE63525_IMR90_HiCCUPS_looplist.txt.gz; chr21 = the rows whose chr1 is 21). Compute an aggregate
    peak analysis (APA; Rao et al. 2014) of the published chr21 loops on the balanced map: place each loop at the
    pixel (i, j), i = the 10-kb bin containing the midpoint of its first anchor (x1-x2), j = the bin containing
    the midpoint of its second anchor (y1-y2); keep the loops with j - i >= 22 bins. For each kept loop take the
    21 x 21 window of pixels (i - 10 ... i + 10) x (j - 10 ... j + 10) of the balanced matrix divided pixel by pixel
    by the expected of the pixel''s diagonal (expected = the mean balanced value over all pixels of that diagonal
    of chr21 whose two bins both have a balancing weight, pixels without contacts counting as 0; pixels of a bin
    without a weight are missing and left out). Average the windows pixel by pixel over the loops (ignoring missing
    values). The APA score is the centre pixel of the averaged window divided by the mean of its lower-left 6 x
    6 corner (rows i + 5 ... i + 10, columns j - 10 ... j - 5: the corner towards the diagonal). Report the number
    of loops piled up and the APA score.'
