- id: T1
  category: imaging
  split: v3
  kind: method
  data: takei+takei_fofct
  prompt: 'This is DNA seqFISH+ chromatin tracing of a mouse cerebellum field of view (Takei et al. 2025), given
    in two formats holding the same spots: a ChromData store, and a 4DN FOF-CT core table (coordinates in micrometres)
    with its cell table. On chr15, first average each trace''s spots into 1-Mb bins (a spot goes to the bin floor(((start
    + end) / 2) / 1,000,000); the bin''s coordinates are the mean x, y, z of the trace''s spots in it; bin start
    = bin index x 1 Mb). Then call domains with the arc p-value TAD caller of ArcFISH (Yu et al. 2025, bioRxiv 2025.11.26.690837;
    the TADCaller(method="pval") of github.com/hyuyu104/ArcFISH) with a window of 4 Mb and every other setting at
    its default (FDR cutoff 0.1, hierarchical domains, its own outlier filter and normalisation). How many domains
    does the finest level have, and at which positions (bin starts, bp) are its boundaries?'
  truth: arcfish_t1
  grade:
    numbers:
    - n_domains
    tol: 0
    rubric:
    - boundaries_match
  method_ref: ArcFISH TADCaller(method="pval") (Yu et al. 2025), github.com/hyuyu104/ArcFISH a21d889
  check: parity
  family: arcfish
