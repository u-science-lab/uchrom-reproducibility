- id: T6
  category: imaging
  split: v3
  kind: method
  data: sox2_holdout
  prompt: 'This folder holds chromatin tracing of the Sox2 locus in mouse ES cells (Huang et al. 2021, Nat. Genet.),
    the 129 allele only, as the example tables of SnapFISH-IMPUTE (github.com/hyuyu104/SnapFISH-IMPUTE, PyPI sfimpute
    0.0.2): sox2_coor.tsv (region, haploid, pos, x, y, z in nm; empty x, y, z = locus not detected), sox2_ann.tsv
    (region, pos, start, end) and holdout.tsv (region, haploid, pos): 4,025 detected loci held out as a test. Hide
    the coordinates of the held-out loci (treat them as not detected), impute every missing locus of every haploid
    with SnapFISH-IMPUTE at its defaults (pairwise distances normalised per genomic separation by a Box-Cox transform,
    missing distances filled iteratively from similar haploids, then the 3-D coordinates of each haploid recovered
    from its distances), and compare the imputed coordinates of the held-out loci with their true coordinates. Report
    the median and the root mean square of the 3-D Euclidean errors (nm) over the 4,025 held-out loci.'
