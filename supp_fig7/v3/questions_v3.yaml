- id: P1
  category: spatial
  split: v3
  kind: method
  data: melanoma+melanoma_r1
  prompt: 'This is spatial Hi-C-RNA of a human melanoma (Guo et al. 2026); each spot has its own 1-Mb contact map.
    The data are given as a ChromData store of both sections and, for section human_melanoma_r1, in community formats:
    a .scool file (one cooler per spot, contacts within and between chromosomes) and a table of the spots (cell_id
    = the spot''s cooler name, array_row, array_col). Use the spots of section human_melanoma_r1. For each spot
    compute (a) y = log2((cis contacts between adjacent 1-Mb bins, bin offset j - i = 1, + 0.5) / (cis contacts
    between bins with offset j - i from 19 to 53, + 0.5)), autosomes only (separation = bin offset x 1 Mb, also
    at the shorter last bin of a chromosome); (b) a copy-number profile from the contacts: for every chromosome
    except chrY, its share of the spot''s contact legs (a cis contact gives its chromosome two legs, a trans contact
    one leg to each of its two chromosomes), and log2 of that share over the chromosome''s median share across the
    section''s spots. Z-score each chromosome''s profile across the spots (sample standard deviation) and take the
    first five principal components (spot scores of the singular value decomposition of the z-scored spot x chromosome
    matrix). The observed statistic is the R^2 of the least-squares fit of y on an intercept and the five components.
    Test it against Moran spectral randomisation (Wagner & Dray 2015, Methods Ecol. Evol. 6:1169) of the five components:
    spots i != j are neighbours (weight 1, else 0) when their array_row and their array_col each differ by at most
    1; take the eigenvectors of the doubly centred weight matrix (I - 11''/n) W (I - 11''/n) that are orthogonal
    to the constant vector (n - 1 of them), sorted by eigenvalue in increasing order and cut into consecutive bands
    of 20 (the last band shorter); for each component (centred), replace its coefficients on the eigenvectors of
    every band by a random standard-normal vector rescaled to the same length, independently per band and per component,
    and rebuild the component from the eigenvectors. Draw 1,000 randomised sets of the five components and refit
    y on each set in the same way. Report the observed R^2, the median and the 95th percentile of the 1,000 randomised
    R^2, and the P value (1 + the number of randomised R^2 at least as large as the observed) / 1,001.'
  truth: msr_copy_number_share
  grade:
    numbers:
    - r2_observed
    - null_median
    - null_q95
    - p
    tol: 0.1
    tol_by_number:
      r2_observed: 0.02
      null_median: 0.1
      null_q95: 0.08
      p: 0.1
  reference: 'null_median / null_q95 / p: mean of 20 runs of 1,000 draws (two implementations, 10 seeds each); tol
    covers the measured Monte Carlo spread (reports/bulk.md)'
  method_ref: Moran spectral randomisation (Wagner & Dray 2015; adespatial msr); numpy
  check: parity
  family: bulk
