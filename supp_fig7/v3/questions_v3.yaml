- id: T4
  category: imaging
  split: v3
  kind: method
  data: su2020_chr2p
  prompt: 'This is chromatin tracing of the chromosome 2 p-arm in IMR90 cells (Su et al. 2020), the first 100 traces
    of the authors'' replicate table, as a FOF-CT core table (coordinates in nm). Call A/B compartments with the
    compartment caller of ArcFISH (Yu et al. 2025; ABCaller with method "axes" of github.com/hyuyu104/ArcFISH, minimum
    compartment size 0, no reference genome), after its own outlier filter and normalisation. The caller splits
    the loci into two clusters: how many loci are in the smaller cluster, and into how many runs of consecutive
