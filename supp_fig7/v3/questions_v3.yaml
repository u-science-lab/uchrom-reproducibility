- id: T5
  category: imaging
  split: v3
  kind: method
  data: bintu2018
  prompt: 'This is chromatin tracing of chr21:18.6-20.6 Mb in IMR90 cells at 30 kb (Bintu et al. 2018), as a FOF-CT
    core table (coordinates in nm). Call domain boundaries with the normalised insulation score of Su et al. 2020
    on the median pairwise distance map, as implemented by ArcFISH''s TADCaller(method="insulation") (github.com/hyuyu104/ArcFISH):
    window 150 kb on each side of a locus, boundaries at the local maxima of the score with a prominence of at least
    0.01. How many boundaries are there, and at which loci (Chrom_Start, bp)?'
