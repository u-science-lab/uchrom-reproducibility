- id: R1
  category: schic
  split: v3
  kind: method
  data: stevens
  prompt: 'These are the single-cell Hi-C contacts of one haploid mouse ES cell and the authors'' published genome
    structure of the same cell (Stevens et al. 2017, Nature 544:59; PDB, 100-kb particles, ten models). Reconstruct
    the cell''s genome structure from the contacts yourself, with the NucDynamics protocol of Stevens et al. (hierarchical
    simulated annealing ending at 1-Mb particles, e.g. particle sizes 8, 4, 2 and 1 Mb; the length of the annealing
    schedule is up to you) or an equivalent restraint-based method. Then compare it with the published structure
    on chromosome 1: average the published first model''s particles into the same 1-Mb bins (bin k holds the particles
    whose sequence position, the last column of the PDB, is in [k Mb, (k+1) Mb)), and report the Spearman correlation
    between the pairwise distances of your structure and of the published one over chr1''s bin pairs (each unordered
    pair of distinct bins present in both, once).'
  truth: nucdyn_cell1
  grade:
    numbers_min:
    - rho
  method_ref: NucDynamics (Stevens et al. 2017; github.com/tjs23/nuc_dynamics @ 00eaf0b)
  check: floor
  revised: v2 M3, the bin rule and the pair set stated
  family: schic
- id: R2
  category: schic
  split: v3
  kind: method
  data: stevens_cell2
  prompt: 'These are the single-cell Hi-C contacts of one haploid mouse ES cell and the authors'' published genome
    structure of the same cell (Stevens et al. 2017, Nature 544:59; Cell 2, GEO GSM2219498; PDB, 100-kb particles,
    ten models). Reconstruct the cell''s genome structure from the contacts yourself, with the NucDynamics protocol
