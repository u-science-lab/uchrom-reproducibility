- id: S3
  category: spatial
  split: new
  kind: anchor
  data: melanoma
  prompt: 'This is spatial Hi-C-RNA of a human melanoma; each spot has its own 1-Mb contact map. Read a copy-number
    profile from the contacts: for each spot of section human_melanoma_r1 with at least 10,000 contacts, count each
    chromosome''s contact legs (a cis contact gives its chromosome two legs, a trans contact one leg to each of
    its two chromosomes; chrY excluded), divide by the spot''s total legs, and take log2 of each chromosome''s share
